<h1 class="h3 page-title mb-4">My profile</h1>

<div class="row g-4">
  <div class="col-lg-5">
    <div class="card card-body">
      <h2 class="h5 mb-3">Personal information</h2>
      <form id="profile-form">
        <div class="row g-2">
          <div class="col-sm-6 mb-3"><label class="form-label" for="profile-first">First name</label><input class="form-control" id="profile-first" value="Admin"></div>
          <div class="col-sm-6 mb-3"><label class="form-label" for="profile-last">Last name</label><input class="form-control" id="profile-last" value="User"></div>
        </div>
        <div class="mb-3"><label class="form-label" for="profile-email">Email</label><input type="email" class="form-control" id="profile-email" value="admin@booknest.com"></div>
        <div class="mb-3"><label class="form-label" for="profile-password">New password</label><input type="password" class="form-control" id="profile-password" placeholder="Leave empty to keep current"></div>
        <button type="button" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="card">
      <div class="card-header bg-white"><strong>My loans</strong></div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead><tr><th>Book</th><th>Due date</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Sapiens</td><td>05.11.2026</td><td><span class="badge bg-primary">Borrowed</span></td></tr>
            <tr><td>The Hobbit</td><td>01.10.2026</td><td><span class="badge bg-success">Returned</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
