<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h1 class="h3 page-title mb-0">Users <span class="badge bg-warning text-dark fs-6 align-middle">admin only</span></h1>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal"><i class="bi bi-plus-lg me-1"></i>Add user</button>
</div>

<input type="search" class="form-control mb-3" placeholder="Search users...">

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Registered</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr><td>Admin User</td><td>admin@booknest.com</td><td><span class="badge bg-warning text-dark">admin</span></td><td>01.09.2026</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Emir Kovač</td><td>emir@example.com</td><td><span class="badge bg-info text-dark">member</span></td><td>12.09.2026</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Lejla Begić</td><td>lejla@example.com</td><td><span class="badge bg-info text-dark">member</span></td><td>20.09.2026</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#userModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="userModalLabel">Add / edit user</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-sm-6 mb-3"><label class="form-label" for="user-first">First name</label><input class="form-control" id="user-first"></div>
          <div class="col-sm-6 mb-3"><label class="form-label" for="user-last">Last name</label><input class="form-control" id="user-last"></div>
        </div>
        <div class="mb-3"><label class="form-label" for="user-email">Email</label><input type="email" class="form-control" id="user-email"></div>
        <div class="mb-3">
          <label class="form-label" for="user-role">Role</label>
          <select class="form-select" id="user-role"><option value="member">Member</option><option value="admin">Admin</option></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
      </div>
    </div>
  </div>
</div>
