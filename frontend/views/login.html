<div class="auth-wrapper">
  <div class="card auth-card p-4">
    <div class="text-center mb-4">
      <i class="bi bi-book-half auth-logo"></i>
      <h1 class="h4 mt-2 page-title">Welcome to BookNest</h1>
      <p class="text-muted small mb-0">Sign in to browse and borrow books</p>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label for="login-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" placeholder="••••••••">
      </div>
      <!-- Static for now: login will call POST /auth/login in Milestone 4 -->
      <a href="#dashboard" class="btn btn-primary w-100">Sign in</a>
    </form>

    <p class="text-center small mt-3 mb-0">
      Don't have an account? <a href="#register">Register</a>
    </p>
  </div>
</div>
