<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h1 class="h3 page-title mb-0">Loans</h1>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#loanModal"><i class="bi bi-plus-lg me-1"></i>New loan</button>
</div>

<!-- Status filter -->
<ul class="nav nav-pills mb-3">
  <li class="nav-item"><a class="nav-link active" href="#loans">All</a></li>
  <li class="nav-item"><a class="nav-link" href="#loans">Borrowed</a></li>
  <li class="nav-item"><a class="nav-link" href="#loans">Overdue</a></li>
  <li class="nav-item"><a class="nav-link" href="#loans">Returned</a></li>
</ul>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead><tr><th>Book</th><th>Member</th><th>Loan date</th><th>Due date</th><th>Returned</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        <tr><td>1984</td><td>Emir Kovač</td><td>19.10.2026</td><td>02.11.2026</td><td>-</td><td><span class="badge bg-primary">Borrowed</span></td>
          <td class="text-end"><button class="btn btn-sm btn-outline-success">Mark returned</button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>The Hobbit</td><td>Lejla Begić</td><td>06.10.2026</td><td>20.10.2026</td><td>-</td><td><span class="badge bg-danger">Overdue</span></td>
          <td class="text-end"><button class="btn btn-sm btn-outline-success">Mark returned</button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Clean Code</td><td>Tarik Mehić</td><td>01.10.2026</td><td>15.10.2026</td><td>14.10.2026</td><td><span class="badge bg-success">Returned</span></td>
          <td class="text-end"><button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="loanModal" tabindex="-1" aria-labelledby="loanModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="loanModalLabel">New loan</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="loan-book">Book</label>
          <select class="form-select" id="loan-book"><option>1984</option><option>Clean Code</option><option>Sapiens</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loan-user">Member</label>
          <select class="form-select" id="loan-user"><option>Emir Kovač</option><option>Lejla Begić</option></select>
        </div>
        <div class="row g-2">
          <div class="col-sm-6 mb-3"><label class="form-label" for="loan-date">Loan date</label><input type="date" class="form-control" id="loan-date"></div>
          <div class="col-sm-6 mb-3"><label class="form-label" for="loan-due">Due date</label><input type="date" class="form-control" id="loan-due"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
      </div>
    </div>
  </div>
</div>
