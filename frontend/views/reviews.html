<h1 class="h3 page-title mb-4">Reviews</h1>

<div class="card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">

      <tbody>
        <tr><td>1984</td><td>Lejla Begić</td><td class="rating">★★★★★</td><td>A must-read. Still relevant today.</td><td>12.10.2026</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#reviewModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>1984</td><td>Emir Kovač</td><td class="rating">★★★★☆</td><td>Dark but brilliant.</td><td>15.10.2026</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#reviewModal" aria-label="Edit"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-outline-danger" aria-label="Delete"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Clean Code</td><td>Tarik Mehić</td><td class="rating">★★★★☆</td><td>Very useful for every programmer.</td><td>16.10.2026</td>

      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5" id="reviewModalLabel">Edit review</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="edit-review-rating">Rating</label>
          <select class="form-select" id="edit-review-rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
        </div>
        <div class="mb-3"><label class="form-label" for="edit-review-comment">Comment</label><textarea class="form-control" id="edit-review-comment" rows="3"></textarea></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
      </div>
    </div>
  </div>
</div>
